// 第 1 章：最佳光徑選擇。數據來自 lib/nirdata.js（由 tools/nir-pathlength/make_data.py 從實測光譜產生）。
const CHAPTER = { number: 1, title: '最佳光徑選擇', minutes: 9, language: 'zh', next: '../ch02/' };

/* ---------- 顏色：同一顏色在全章代表同一件事 ---------- */
const PATHS = NIR.paths;                                   // [0.25, 0.5, 1, 2, 5] mm
const PATHC = { 0.25: '#7ec8e3', 0.5: '#6fd3a0', 1: '#f2c14e', 2: '#f39060', 5: '#e8596b' };   // 光徑
const SAMPC = ['#a8a8a8', '#c9bcff', '#a28eff', '#7f62ff'];  // 水、3.32、4.87、7.45 %
const SAMPL = ['水 0%', '3.32%', '4.87%', '7.45%'];
const GOLD = '#f2c14e', OKC = '#6fd3a0', BADC = '#ff6b6b', WATERC = '#6fa8dc';
const CONC = NIR.conc, WL = NIR.wl;
const A_LIM = 1.5;
const RATIO = [1.00, 1.93, 3.95, 3.38, -0.36];             // 2258 nm 靈敏度比（以 0.25 mm 為 1），與報告一致
const IDEAL = PATHS.map(p => p / 0.25);
const pstr = p => String(p) + ' mm';
const fmt = (v, d = 2) => v.toFixed(d).replace('-', '−');

/* ---------- 由數據計算（與 R / Python 練習同一算法） ---------- */
const nMaxA = p => WL.map((_, i) => Math.max(...NIR.A[String(p)].map(s => s[i])));
const nFrac = p => nMaxA(p).filter(a => a < A_LIM).length / WL.length;
function nSegments(p) {                                    // 4 條光譜皆 A < 1.5 的連續波段
  const ok = nMaxA(p).map(a => a < A_LIM), out = [];
  for (let i = 0; i < ok.length; i++) {
    if (!ok[i]) continue;
    let j = i; while (j + 1 < ok.length && ok[j + 1]) j++;
    if (j > i) out.push([WL[i], WL[j]]);
    i = j;
  }
  return out;
}
function nFit(xs, ys) {                                    // 最小平方法直線
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
  const slope = sxy / sxx; return { slope, icpt: my - slope * mx };
}
const B1 = NIR.band['2258']['1'];                          // 1 mm、2258 nm
const D2K = B1.d2.map(v => v * 1e3);                       // 二階導數 ×10³
const FIT1 = nFit(CONC, D2K);
const R2_1 = (() => { const my = D2K.reduce((a, b) => a + b) / 4; let r = 0, t = 0;
  D2K.forEach((y, i) => { r += (y - (FIT1.icpt + FIT1.slope * CONC[i])) ** 2; t += (y - my) ** 2; }); return 1 - r / t; })();
const LOO = CONC.map((c, j) => {                           // 留一交叉驗證
  const xs = CONC.filter((_, k) => k !== j), ys = D2K.filter((_, k) => k !== j), f = nFit(xs, ys);
  const pred = (D2K[j] - f.icpt) / f.slope; return { f, pred, err: c - pred };
});
const RMSECV = Math.sqrt(LOO.reduce((a, l) => a + l.err ** 2, 0) / 4);

/* ---------- 繪圖小工具（加 n 前綴，避免和引擎的全域名稱衝突） ---------- */
function nTitle(p, str, t0 = .2) { const e = T(p, str, { x: 110, y: 96, size: 40, weight: 700, o: 0 }); show(e, t0); return e; }
function nText(p, str, x, y, t0, { size = 28, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) {
  const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e;
}
function nPlot(p, box, xr, yr, o = {}) {
  const [bx, by, bw, bh] = box;
  const px = v => bx + (v - xr[0]) / (xr[1] - xr[0]) * bw;
  const py = v => by + bh - (v - yr[0]) / (yr[1] - yr[0]) * bh;
  const g = G(p, { o: 0 });
  const y0 = o.y0 != null ? py(o.y0) : by + bh;
  path(g, `M${bx} ${by}V${by + bh}`, { stroke: COL.dim, 'stroke-width': 2, fill: 'none' });
  path(g, `M${bx} ${y0}H${bx + bw}`, { stroke: COL.dim, 'stroke-width': 2, fill: 'none' });
  (o.xt || []).forEach(v => {
    path(g, `M${px(v)} ${by + bh}v8`, { stroke: COL.dim, 'stroke-width': 2 });
    T(g, o.xf ? o.xf(v) : String(v), { x: px(v), y: by + bh + 32, size: 22, fill: COL.dim, anchor: 'middle' });
  });
  (o.yt || []).forEach(v => {
    path(g, `M${bx} ${py(v)}h-8`, { stroke: COL.dim, 'stroke-width': 2 });
    T(g, o.yf ? o.yf(v) : String(v), { x: bx - 14, y: py(v) + 8, size: 22, fill: COL.dim, anchor: 'end' });
  });
  if (o.xl) T(g, o.xl, { x: bx + bw + 12, y: by + bh + 32, size: 22, fill: COL.dim });
  if (o.yl) T(g, o.yl, { x: bx - 6, y: by - 18, size: 22, fill: COL.dim });
  show(g, o.t0 ?? .2);
  return { g, px, py, box };
}
const nLineD = (P, xs, ys) => xs.map((x, i) => (i ? 'L' : 'M') + P.px(x).toFixed(1) + ' ' + P.py(ys[i]).toFixed(1)).join('');
function nCurve(P, xs, ys, color, t0, dur = 1, w = 3, extra = {}) {
  const e = path(P.g, nLineD(P, xs, ys), { stroke: color, 'stroke-width': w, fill: 'none', 'stroke-linejoin': 'round', ...extra }, { d: 0 });
  draw(e, t0, dur); return e;
}
function nDot(parent, x, y, r, fill, t0, extra = {}) {
  const e = G(parent, { x, y, s: 0 }); mk('circle', { r, fill, ...extra }, e); tw(e, { s: 1 }, t0, .4, back); return e;
}
function nBand(P, x0, x1, fill, o, t0) {                    // 直立色帶（波段標示）
  const [, by, , bh] = P.box;
  const e = mk('rect', { x: P.px(x0), y: by, width: Math.max(2, P.px(x1) - P.px(x0)), height: bh, fill }, P.g);
  put(e, { o: 0 }); tw(e, { o }, t0, .6); return e;
}
function nHLine(P, v, color, t0, dash = '10 8') {
  const [bx, , bw] = P.box;
  const e = path(P.g, `M${bx} ${P.py(v)}H${bx + bw}`, { stroke: color, 'stroke-width': 3, 'stroke-dasharray': dash }, { o: 0 });
  show(e, t0); return e;
}
function nBar(parent, x, w, yBase, yTop, fill, t0, dur = .8, extra = {}) {   // 由基線長出的長條
  const e = mk('rect', { x: x - w / 2, y: yBase, width: w, height: 0, fill, ...extra }, parent);
  const top = Math.min(yBase, yTop), hgt = Math.abs(yBase - yTop);
  tw(e, { a_y: top, a_height: hgt }, t0, dur, out); return e;
}
function nArrowHead(parent, x, y, dir, color, size = 16) {  // dir: 'r' 'd'
  const d = dir === 'r' ? `M${x} ${y}l${-size} ${-size * .6}v${size * 1.2}z` : `M${x} ${y}l${-size * .6} ${-size}h${size * 1.2}z`;
  return path(parent, d, { fill: color });
}
function nLegend(parent, items, x, y, t0, size = 24) {      // items: [[label, color]]
  const g = G(parent, { o: 0 });
  items.forEach(([lab, c], i) => {
    path(g, `M${x} ${y + i * 34 - 8}h30`, { stroke: c, 'stroke-width': 5 });
    T(g, lab, { x: x + 42, y: y + i * 34, size, fill: c });
  });
  show(g, t0); return g;
}

/* ---------- 二階導數示範用的玩具光譜 ---------- */
const TX0 = Array.from({ length: 121 }, (_, i) => -1 + i / 60);
const toyPeak = (x, h = 1) => h * Math.exp(-((x / .2) ** 2));
const TOY_BASE = [x => .2, x => .55, x => .2 + .45 * (x + 1) / 2];      // 平、平移、傾斜
const TOYC = [COL.chalk, '#6fb0ff', '#ff9f6b'];
const dd = (ys, k) => { let y = ys; for (let n = 0; n < k; n++) y = y.map((v, i) => (y[Math.min(i + 1, y.length - 1)] - y[Math.max(i - 1, 0)]) / (2 / 60)); return y; };

/* ---------- Savitzky–Golay 示範：1 mm、7.45% 在 2258 nm 附近 ---------- */
const SG_I = B1.i, SG_S = NIR.A['1'][3];
function sgQuad(k) {                                       // 在 k−4…k+4 擬合 y = a x² + b x + c（x = −4…4）
  const xs = [-4, -3, -2, -1, 0, 1, 2, 3, 4], ys = xs.map(x => SG_S[k + x]);
  // 正規方程式（x 對稱，Σx = Σx³ = 0）
  const n = 9, s2 = 60, s4 = 708;
  const sy = ys.reduce((a, b) => a + b), sxy = xs.reduce((a, x, i) => a + x * ys[i], 0), sx2y = xs.reduce((a, x, i) => a + x * x * ys[i], 0);
  const a = (n * sx2y - s2 * sy) / (n * s4 - s2 * s2), c = (sy - a * s2) / n, b = sxy / s2;
  return { a, b, c };
}
const SG_D2R = (() => { const v = []; for (let k = SG_I - 6; k <= SG_I + 6; k++) v.push(2 * sgQuad(k).a);
  const lo = Math.min(0, ...v), hi = Math.max(...v), pad = (hi - lo) * .15; return [lo - pad, hi + pad]; })();
const wlAt = j => { const i = Math.floor(j), f = j - i; return WL[i] + (WL[Math.min(i + 1, WL.length - 1)] - WL[i]) * f; };

/* ---------- beats ---------- */

    });

  }],

    const b2 = mk('rect', { x: 300, y: 580, width: 0, height: 40, fill: GOLD }, p); tw(b2, { a_width: 320 }, m('double') + 1.4, .9, out);
    nText(p, 'A', 480, 450, m('double') + 1.2, { size: 30, fill: GOLD, weight: 700 });
    nText(p, '2A', 640, 610, m('double') + 2.2, { size: 30, fill: GOLD, weight: 700 });
    // 理想直線
    const P = nPlot(p, [930, 380, 560, 280], [0, 5.4], [0, 22], { xt: [0, 0.5, 1, 2, 5], xf: v => String(v), xl: 'mm', yt: [0, 4, 8, 12, 16, 20], yl: 'A（以 0.25 mm 為 1）', t0: m('line') });
    nCurve(P, [0, 5.4], [0, 21.6], COL.chalk, m('line') + .4, 1.2, 3, { 'stroke-dasharray': '10 8' });

    const rl = nText(p, '理想：A 與 b 成正比', 1210, 720, m('ruler'), { size: 30, fill: GOLD, anchor: 'middle', weight: 700 });

      { xt: [1400, 1600, 1800, 2000, 2200, 2400], xl: 'nm', yt: [0, .5, 1, 1.5, 2, 2.5], yf: v => String(v), yl: '吸光度 A（水）', t0: m('spec') - .3 });

  ['q1', '小測驗', () => {}, { ask: done => quiz(BAND, [{
    id: 'c-ratio', prompt: ['某吸收帶在 0.25 mm 的吸光度是 0.4。若比爾–朗伯定律成立，換成 2 mm 時吸光度應為多少？'],
    build: blanks([{ parts: ['A = ', { box: '3.2' }], why: '2 ÷ 0.25 = 8 倍，0.4 × 8 = 3.2。但這已超過儀器上限（約 2.2–2.4），實際量到的會被壓平：飽和。', hint: '光徑變成幾倍？2 ÷ 0.25 = ?' }]),
  }], done) }],

  ['bands', '特徵帶', (m) => {
    const p = panel(0);
    nTitle(p, '用化學原理選特徵帶');
    const P = nPlot(p, [130, 150, 880, 450], [1340, 2550], [0, 2.6],
      { xt: [1400, 1600, 1800, 2000, 2200, 2400], xl: 'nm', yt: [0, .5, 1, 1.5, 2, 2.5], yl: '吸光度 A（1 mm）', t0: .2 });
    CONC.forEach((_, i) => nCurve(P, WL, NIR.A['1'][i], SAMPC[i], .3 + i * .3, 1.2, 2.5));
    nLegend(p, SAMPL.map((l, i) => [l, SAMPC[i]]), 1050, 190, .8, 22);
    nBand(P, 2246, 2270, GOLD, .3, m('ch'));

      nBand(P, a, b, OKC, .22, m('shade') + .5 + i * 2.5);
      nText(p, Math.round(a) + '–' + Math.round(b), P.px((a + b) / 2), 142, m('shade') + .8 + i * 2.5, { size: 22, fill: OKC, anchor: 'middle', weight: 700 });
    });
    [[1890, 2100], [2300, 2550]].forEach(([a, b], i) => {
      nBand(P, a, b, BADC, .18, m('out') + .3 + i * 1.5);
      nText(p, '排除', P.px((a + b) / 2), 590, m('out') + .6 + i * 1.5, { size: 22, fill: BADC, anchor: 'middle', weight: 700 });
    });
    const rx = 1070;
    nText(p, '可用（4 條皆 A < 1.5）', rx, 260, m('shade'), { size: 24, fill: OKC, weight: 600 });
    seg.forEach(([a, b], i) => nText(p, Math.round(a) + '–' + Math.round(b) + ' nm', rx, 300 + i * 38, m('shade') + .8 + i * 2.5, { size: 24, fill: COL.chalk }));
    nText(p, '濃度更高時改用 0.5 mm', rx, 460, m('alt'), { size: 26, fill: PATHC[0.5], weight: 700 });
    nSegments(0.5).forEach(([a, b], i) => nText(p, Math.round(a) + '–' + Math.round(b) + ' nm', rx, 500 + i * 38, m('alt') + .6, { size: 24, fill: COL.dim }));
  }],

  ['wrap', '總結', (m) => {
    const p = panel(0);
    nTitle(p, '總結');
    [['吸光度要小於 1.5，避開飽和。', 'w1'], ['用化學原理選特徵帶，二階導數消除基線。', 'w2'],
     ['在靈敏度與光徑成正比的範圍內，取最長光徑。', 'w3'], ['R²、LOD、RMSECV 是輔助；雜訊在平坦區估。', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 28, fill: GOLD }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 32, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 38, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    nText(p, '下一步：做練習，再用 R 或 Python 親手驗證', 800, 740, m('end'), { size: 30, fill: GOLD, anchor: 'middle' });
  }],

  ['final1', '本章練習', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ideal', prompt: ['2 mm 在 2258 nm 的實測靈敏度比是 3.38（以 0.25 mm 為 1）。若比爾–朗伯成立，理想值應為多少？'],
    build: blanks([{ parts: ['理想值 = ', { box: '8' }], why: '2 ÷ 0.25 = 8。實測 3.38 遠低於 8，表示 2 mm 已經飽和。', hint: '理想值 = 光徑 ÷ 0.25 mm。' }]),
  }, {
    id: 'p-lod', prompt: ['校正直線斜率為 −0.001（每 1% 酸度），二階導數的雜訊 σ = 0.0002。偵測極限 LOD 是多少 %？'],
    build: blanks([{ parts: ['LOD = ', { box: '0.6' }, ' %'], why: 'LOD = 3σ ÷ |斜率| = 3 × 0.0002 ÷ 0.001 = 0.6 %。', hint: '記得取斜率的絕對值：3 × 0.0002 ÷ 0.001。' }]),
  }, {
    id: 'p-class', prompt: ['依 2258 nm 的靈敏度比（實測 / 理想），判斷每個光徑：'],
    build: grid([
      { parts: ['0.5 mm：1.93 / 2'], ans: ['ok'], why: '接近理想，正比成立。' },
      { parts: ['1 mm：3.95 / 4'], ans: ['ok'], why: '接近理想，正比成立，而且是其中最長的。' },
      { parts: ['2 mm：3.38 / 8'], ans: ['sat'], why: '不到理想的一半：飽和。' },
      { parts: ['5 mm：−0.36 / 20'], ans: ['sat'], why: '連方向都反了：嚴重飽和。' },
    ], [['ok', '正比成立'], ['sat', '已飽和']], { multi: false, text: true }),
  }], done, '本章練習') }],

  ['finish', '完成', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
