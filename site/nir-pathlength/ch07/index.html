<script>
'use strict';
// 第 7 章：設計下一次實驗。數字全由 tools/nir-pathlength/make_data_ch07.py 算出（lib/ch07data.js），
// 與 exercises/ch07_experiment_design.* 一致。漂移、彎曲、配製誤差、分組都是示意，畫面上標明。
const CHAPTER = { number: 7, title: '設計下一次實驗', minutes: 8, language: 'zh' };

const SC7 = CH7.scan, PL7 = CH7.pilot, SN7 = CH7.sens, SR7 = CH7.sens_ref, SP7 = CH7.spacing, OR7 = CH7.order, CL7 = CH7.class;
const f2 = v => fmt(v, 2);
const LVC7 = [0, 1, 2, 3, 4, 5, 6, 7].map(i => `hsl(${210 - i * 22}, 70%, ${58 + i * 2}%)`);   // 0–7 % 的顏色
const NOTE7 = { size: 20, fill: COL.dim };
const range7 = (P, x, lo, hi, color, t0) => {   // 一條直的範圍線＋兩端點
  const e = path(P.g, `M${P.px(x)} ${P.py(lo)}V${P.py(hi)}`, { stroke: color, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  show(e, t0); nDot(P.g, P.px(x), P.py(lo), 9, color, t0 + .2);
};
const chip7 = (p, x, y, lv, t0, s = 42) => {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: s, height: s, rx: 6, fill: LVC7[lv] }, g);
  T(g, String(lv), { x: x + s / 2, y: y + s * .7, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  show(g, t0, .3); return g;
};
const rows7 = (p, items, y0, dy, size, m) => items.forEach(([str, mark], i) => {
  const g = G(p, { x: -16, y: y0 + i * dy, o: 0 });
  mk('circle', { cx: 200, cy: -12, r: 28, fill: GOLD }, g);
  T(g, String(i + 1), { x: 200, y: -1, size: 32, fill: COL.board, weight: 700, anchor: 'middle' });
  T(g, str, { x: 260, size, weight: 600 });
  tw(g, { o: 1, x: 0 }, m(mark), .6);
});

const BEATS = [
  ['intro', '設計下一次實驗', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, '第 7 章 · 近紅外光譜定量醋酸', { x: 800, y: 320, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, '設計下一次實驗', { x: 800, y: 440, size: 84, weight: 700, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = T(scene, '這次要量出什麼？', { x: 800, y: 560, size: 42, fill: GOLD, anchor: 'middle', o: 0 });
    show(r, m('sub'));
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['unknown', '還不知道什麼', (m) => {
    const p = panel(0);
    nTitle(p, '現有數據回答不了的問題');
    nText(p, '問題', 260, 220, .3, { size: 24, fill: COL.dim });
    nText(p, '現有數據', 900, 220, .3, { size: 24, fill: COL.dim });
    [['儀器雜訊多大？', '0.25 mm 的水掃了兩次 ✓', OKC, 'now'],
     ['填樣誤差多大？', '每瓶只填一次 ✗', BADC, 'fill'],
     ['參考值誤差多大？', 'Atago 和滴定差很多 ✗', BADC, 'ref'],
     ['真的是直線嗎？', '4 個濃度、沒有重複 ✗', BADC, 'line'],
     ['換一瓶新的醋還準嗎？', '沒有獨立的未知樣品 ✗', BADC, 'new']].forEach(([q, a, c, mark], i) => {
      nText(p, q, 260, 300 + i * 80, m(mark), { size: 32, weight: 600 });
      nText(p, a, 900, 300 + i * 80, m(mark) + .5, { size: 30, fill: c, weight: 700 });
    });
    nText(p, '下一次實驗的目的：把這些量出來', 800, 740, m('aim'), { size: 34, anchor: 'middle', fill: GOLD, weight: 700 });
  }],

  ['noise', '誤差在哪一層', (m) => {
    const p = panel(0);
    nTitle(p, '各層誤差，換成濃度（%）');
    const P = nPlot(p, [180, 170, 740, 450], [-.6, 3.6], [0, 1.1], { xt: [], yt: [0, .25, .5, .75, 1], yl: '標準差（酸度 %）', t0: .2 });
    const bars = [[SC7.conc025, '掃描', '0.25 mm 實測*', WATERC, 'scan'], [SC7.conc1_est, '掃描', '1 mm 粗估', WATERC, 'est'],
                  [SC7.resid_titr, '校正殘差', '滴定', GOLD, 'resid'], [SC7.resid_atago, '校正殘差', 'Atago', BADC, 'resid']];
    bars.forEach(([v, a, b, c, mark], i) => {
      const t0 = m(mark) + (i === 3 ? 1 : 0);
      nBar(P.g, P.px(i), 80, P.py(0), P.py(v), c, t0);
      nText(p, (v < .1 ? v.toFixed(3) : f2(v)), P.px(i), P.py(v) - 14, t0 + .6, { size: 24, anchor: 'middle', fill: c, weight: 700 });
      nText(p, a, P.px(i), P.box[1] + P.box[3] + 36, t0, { size: 22, anchor: 'middle' });
      nText(p, b, P.px(i), P.box[1] + P.box[3] + 64, t0, { size: 20, anchor: 'middle', fill: COL.dim });
    });
    nText(p, '* 以 1 mm 斜率換算', 1010, 200, m('scan'), { size: 20, fill: COL.dim });
    nText(p, '1 mm 吸光度較高，雜訊放大約 ' + SC7.scale.toFixed(1) + ' 倍（粗估）', 1010, 235, m('est'), { size: 22, fill: COL.dim });
    nText(p, '大部分誤差來自', 1010, 310, m('resid') + 1.5, { size: 28 });
    nText(p, '填樣和參考值，不是儀器', 1010, 352, m('resid') + 2, { size: 28, fill: GOLD, weight: 700 });
    nText(p, '重複要做在對的層次：', 1010, 450, m('layers'), { size: 28, weight: 700 });
    nText(p, '稀釋 → 填樣 → 掃描', 1010, 495, m('layers') + .8, { size: 30, fill: OKC, weight: 700 });
    nText(p, '同一次填樣掃 3 次 ≠ 3 次獨立測量', 1010, 590, m('pseudo'), { size: 26, fill: BADC, weight: 700 });
    nText(p, '（假重複：區間被低估）', 1010, 630, m('pseudo') + 1, { size: 24, fill: COL.dim });
  }],

  ['pilot', '先做預試驗', (m) => {
    const p = panel(0);
    nTitle(p, '重新填樣 k 次，算出的標準差有多可靠？');
    const P = nPlot(p, [180, 170, 720, 470], [-.6, 4.6], [0, 7], { xt: [], yt: [0, 1, 2, 4, 6], yl: '真正 σ ÷ 算出的 s（95 %）', t0: .2 });
    nHLine(P, 1, COL.dim, .4);
    PL7.forEach((r, i) => {
      const t0 = m('k') + .4 + i * .3, c = r.k === 3 ? BADC : r.k === 10 ? OKC : GOLD;
      range7(P, i, r.lo, Math.min(r.hi, 7), c, r.k === 3 ? m('k3') : r.k === 10 ? m('k10') : t0);
      nText(p, 'k = ' + r.k, P.px(i), P.box[1] + P.box[3] + 40, t0, { size: 24, anchor: 'middle' });
      if (r.hi > 7) nText(p, '↑ ' + r.hi.toFixed(0), P.px(i) + 14, P.py(7) + 26, t0 + .3, { size: 22, fill: GOLD });
    });
    const k3 = PL7.find(r => r.k === 3), k10 = PL7.find(r => r.k === 10);
    nText(p, '填 3 次：' + f2(k3.lo) + '–' + k3.hi.toFixed(1) + ' 倍', 1000, 230, m('k3'), { size: 28, fill: BADC, weight: 700 });
    nText(p, '填 10 次：' + f2(k10.lo) + '–' + f2(k10.hi) + ' 倍', 1000, 275, m('k10'), { size: 28, fill: OKC, weight: 700 });
    nText(p, '現在的殘差：自由度 2，和填 3 次一樣', 1000, 330, m('now'), { size: 22, fill: COL.dim });
    nText(p, '區間寬度取決於填樣誤差', 1000, 410, m('sens'), { size: 26, weight: 700 });
    nText(p, '（8 濃度 × 3 次，未知樣品填 1 次）', 1000, 445, m('sens'), NOTE7);
    [0.2, 0.4, 1.0].forEach((s, k) => {
      const i = SN7.s.indexOf(s);
      nText(p, '填樣誤差 ' + s.toFixed(1) + ' %  →  ±' + f2(SN7.m1[i]) + ' %', 1020, 495 + k * 42, m('sens') + .8 + k * .6, { size: 26, fill: k === 2 ? BADC : COL.chalk });
    });
    nText(p, '先用一瓶醋重新填樣 10 次', 1000, 680, m('plan'), { size: 30, fill: GOLD, weight: 700 });
  }],

  ['q1', '小測驗', () => {}, { ask: done => quiz({ x: 330, y: 130, w: 940, cls: 'side' }, [{
    id: 'c-pseudo', prompt: ['未知樣品只填一次樣，掃描 3 次取平均。算預測區間時，重複次數 m 應該用多少？'],
    build: choice([['1：三次掃描共用同一次填樣，填樣誤差沒有被平均掉'], ['3：一共量了三次'], ['不用算區間，平均已經很準']], 0,
      '掃描雜訊只佔誤差的一小部分；要讓 m = 3，必須重新填樣三次。',
      [null, '三次掃描不是三次獨立的測量，這是假重複。', '平均只縮小掃描雜訊，填樣和參考值的誤差都還在。']),
  }], done) }],

  ['spacing', '濃度怎麼排', (m) => {
    const p = panel(0);
    nTitle(p, '同樣量 24 次，濃度怎麼排？');
    const cols = [['排法', 260], ['斜率標準誤', 540], ['檢查直線的自由度', 760]];
    cols.forEach(([s, x]) => nText(p, s, x, 220, .3, { size: 22, fill: COL.dim, anchor: 'middle' }));
    nText(p, '（現在 4 點 = 1）', 540, 250, .3, { size: 18, fill: COL.dim, anchor: 'middle' });
    [['兩端各 12 次', 'ends'], ['3 個濃度各 8 次', 'three'], ['8 個濃度各 3 次', 'eight']].forEach(([name, key], i) => {
      const y = 320 + i * 80, d = SP7[key], c = key === 'eight' ? OKC : COL.chalk;
      nText(p, name, 260, y, m('se') + i * .3, { size: 28, anchor: 'middle', fill: c, weight: key === 'eight' ? 700 : 500 });
      nText(p, f2(d.se_rel), 540, y, m('se') + .3 + i * .3, { size: 30, anchor: 'middle', fill: c, weight: 700 });
      nText(p, String(d.lof_df), 760, y, m('lof') + i * .3, { size: 30, anchor: 'middle', fill: d.lof_df === 0 ? BADC : c, weight: 700 });
    });
    const C = SP7.curve, P = nPlot(p, [960, 200, 400, 340], [0, 7], [0, 7], { xt: [0, 3.5, 7], xl: '真正的酸度 %', yt: [0, 3.5, 7], yl: '量到的訊號（換算）', t0: m('curve') });
    nCurve(P, C.x, C.x, COL.dim, m('curve') + .3, .8, 2, { 'stroke-dasharray': '8 6' });
    nCurve(P, C.x, C.y, GOLD, m('curve') + .6, 1.2, 4);
    [0, 7].forEach(x => nDot(P.g, P.px(x), P.py(x), 10, BADC, m('curve') + 1.2));
    nText(p, '示意：反應有點彎', 980, 620, m('curve') + 1, { size: 22, fill: GOLD });
    nText(p, '只量兩端：中間偏 ' + f2(C.mid_bias) + ' % 卻看不出來', 980, 655, m('curve') + 2, { size: 22, fill: BADC });
    nText(p, '選 8 個濃度、各 3 次：犧牲一點斜率精度，換來檢查直線的能力', 800, 750, m('pick'), { size: 28, anchor: 'middle', fill: OKC, weight: 700 });
  }],

  ['order', '測量順序', (m) => {
    const p = panel(0);
    nTitle(p, '24 次測量的順序（示意：整段漂移相當於 0.5 %）');
    const x0 = 330, cx = i => x0 + i * 46 + Math.floor(i / 8) * 18;
    const ar = path(p, `M${x0} 215H${cx(23) + 42}`, { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 });
    show(ar, m('drift'));
    nText(p, '時間 →　儀器慢慢漂移', x0, 200, m('drift'), { size: 22, fill: COL.dim });
    nText(p, '由低到高', 150, 278, m('asc'), { size: 26, weight: 700 });
    [...Array(24).keys()].forEach(i => chip7(p, cx(i), 248, Math.floor(i / 3), m('asc') + i * .04));
    nText(p, '分 3 塊打亂', 150, 368, m('block'), { size: 26, weight: 700, fill: OKC });
    OR7.example.forEach((lv, i) => chip7(p, cx(i), 338, lv, m('block') + .3 + i * .04));
    nText(p, '數字 = 酸度 %（0–7）', x0, 420, m('asc') + 1, NOTE7);
    nText(p, '由低到高：斜率偏差 +' + OR7.asc_bias.toFixed(1) + ' %', 330, 500, m('asc') + 1, { size: 30, fill: BADC, weight: 700 });
    nText(p, '完全隨機：平均 0，95 % 範圍 ±' + OR7.rand_95.toFixed(1) + ' %', 330, 560, m('rand'), { size: 30, fill: GOLD, weight: 700 });
    nText(p, '分 3 塊、每塊 8 個濃度各一次、塊內打亂：±' + OR7.block_95.toFixed(2) + ' %', 330, 620, m('block') + 1.5, { size: 30, fill: OKC, weight: 700 });
    nText(p, '順序表在實驗前排好，照表操作；換樣品前潤洗樣品槽', 800, 730, m('sheet'), { size: 28, anchor: 'middle', fill: GOLD });
  }],

  ['q2', '小測驗', () => {}, { ask: done => quiz({ x: 330, y: 130, w: 940, cls: 'side' }, [{
    id: 'c-order', prompt: ['8 個濃度、各填樣 3 次，共 24 次測量。順序怎麼排最好？'],
    build: choice([['分 3 個區塊，每塊 8 個濃度各一次，塊內打亂'], ['由低濃度量到高濃度'], ['同一個濃度的 3 次連續量完，再換下一個']], 0,
      '分區塊打亂，儀器漂移就不會和濃度綁在一起；區塊之間的漂移也互相抵銷。',
      [null, '漂移會和濃度綁在一起，斜率跟著偏。交叉污染靠潤洗解決，不靠順序。', '同一濃度的 3 次擠在同一段時間，漂移會變成那個濃度的偏差。']),
  }], done) }],

  ['xval', '濃度值怎麼來', (m) => {
    const p = panel(0);
    nTitle(p, '參考值：滴定原液，秤重稀釋');
    nText(p, '一瓶醋當原液，滴定 × 3', 150, 240, m('stock'), { size: 28, weight: 700, fill: GOLD });
    nText(p, '↓ 秤重稀釋（比體積準）', 150, 290, m('stock') + .8, { size: 26 });
    nText(p, '0–7 %，8 個濃度', 150, 340, m('stock') + 1.6, { size: 28, weight: 700, fill: GOLD });
    nText(p, '同一個稀釋的 3 次填樣，', 150, 440, m('shared'), { size: 26 });
    nText(p, '共用同一個配製誤差', 150, 480, m('shared') + .6, { size: 26, fill: BADC, weight: 700 });
    const P = nPlot(p, [980, 190, 480, 360], [-.6, 3.6], [0, .7], { xt: [], yt: [0, .2, .4, .6], yl: '每個濃度的標準差（%）', t0: m('fills') });
    nHLine(P, .4, BADC, m('fills') + .3);
    nText(p, '紅線：配製誤差 0.4（示意）', P.px(3.6), P.box[1] - 14, m('fills') + .3, { size: 20, fill: BADC, anchor: 'end' });
    SR7.more_fills.fills.forEach((f, i) => {
      const v = SR7.more_fills.pt_sd[i];
      nBar(P.g, P.px(i), 60, P.py(0), P.py(v), GOLD, m('fills') + .8 + i * .5);
      nText(p, f2(v), P.px(i), P.py(v) - 12, m('fills') + 1.2 + i * .5, { size: 22, anchor: 'middle', fill: GOLD, weight: 700 });
      nText(p, '填 ' + f + ' 次', P.px(i), P.box[1] + P.box[3] + 36, m('fills') + .8 + i * .5, { size: 22, anchor: 'middle' });
    });
    nText(p, '分析時：同一濃度的 3 次先平均，當成 8 個點（自由度 6）', 800, 640, m('avg'), { size: 28, anchor: 'middle', weight: 700 });
    nText(p, '當成 24 個獨立點：±' + f2(SN7.m3[SN7.s.indexOf(.4)]) + '（只在配製誤差 = 0 時成立）', 800, 690, m('cmp'), { size: 26, anchor: 'middle', fill: BADC });
    nText(p, '8 個平均點：±' + f2(SR7.hw[0]) + '（配製誤差 0）、±' + f2(SR7.hw[2]) + '（配製誤差 0.4）', 800, 735, m('cmp') + 2.5, { size: 26, anchor: 'middle', fill: OKC, weight: 700 });
    nText(p, '（填樣誤差 0.4 %、未知樣品填 3 次）', 800, 775, m('cmp') + 3, { size: 20, anchor: 'middle', fill: COL.dim });
  }],

  ['blind', '獨立驗證', (m) => {
    const p = panel(0);
    nTitle(p, '用獨立的盲樣驗證');
    nText(p, '8 個濃度都從同一瓶稀釋：', 200, 250, m('why'), { size: 30, weight: 700 });
    nText(p, '酸、糖、色素一起等比例變化 → 模型學到的可能不只是酸', 200, 300, m('why') + 1, { size: 28, fill: BADC });
    nText(p, '另外準備 3–5 種市售醋：不參加校正，一樣滴定 × 3', 200, 400, m('brands'), { size: 30, fill: GOLD, weight: 700 });
    nText(p, '由別人編號，量的人不知道濃度（盲樣）', 200, 490, m('blind'), { size: 30, fill: GOLD, weight: 700 });
    nText(p, '報告：預測誤差 RMSEP 與平均偏差', 200, 580, m('report'), { size: 30, fill: OKC, weight: 700 });
    nText(p, '→ 換了醋，還準不準？', 200, 630, m('report') + 1, { size: 28 });
  }],

  ['class', '課堂分組', (m) => {
    const p = panel(0);
    nTitle(p, '實驗課分組（示意：8 組）');
    const gx = j => 450 + j * 76, gy = i => 230 + i * 50;
    [0, 1, 2, 3, 4, 5, 6, 7].forEach(j => nText(p, j + ' %', gx(j) + 21, 205, .3, { size: 20, anchor: 'middle', fill: LVC7[j] }));
    nText(p, '對照', gx(8) + 21, 205, .3, { size: 20, anchor: 'middle', fill: OKC });
    CL7.groups.forEach((_, i) => nText(p, '第 ' + (i + 1) + ' 組', 330, gy(i) + 30, .3, { size: 22 }));
    const box = (i, j, fill, t0) => { const e = G(p, { o: 0 }); mk('rect', { x: gx(j), y: gy(i), width: 42, height: 40, rx: 6, fill }, e); show(e, t0, .3); return e; };
    const bad = CL7.groups.map((_, i) => box(i, i, BADC, m('bad') + i * .1));
    bad.forEach(e => hide(e, m('good') - .2, .3));
    CL7.groups.forEach((g, i) => g.forEach((j, k) => box(i, j, LVC7[j], m('good') + i * .15 + k * .05)));
    CL7.groups.forEach((_, i) => box(i, 8, OKC, m('control') + i * .08));
    nText(p, '一組做一個濃度：', 1170, 260, m('bad'), { size: 24, fill: BADC, weight: 700 });
    nText(p, '組的差異和濃度分不開', 1170, 296, m('bad') + .6, { size: 24, fill: BADC });
    nText(p, '每組 4 個濃度，有高有低', 1170, 380, m('good'), { size: 24, weight: 700 });
    nText(p, '每個濃度剛好 ' + CL7.per_level[0] + ' 組做', 1170, 416, m('good') + .8, { size: 24 });
    nText(p, '每組都量同一瓶對照', 1170, 500, m('control'), { size: 24, fill: OKC, weight: 700 });
    nText(p, '→ 估計組和組的差異', 1170, 536, m('control') + .6, { size: 24, fill: OKC });
    nText(p, '每組 5 × 3 = 15 次填樣', 1170, 620, m('total'), { size: 24, weight: 700, fill: GOLD });
    nText(p, '全班 120 條光譜', 1170, 656, m('total') + .6, { size: 24, fill: GOLD });
    nText(p, '人數不同，照同樣原則調整', 800, 760, m('total') + 2, { size: 24, anchor: 'middle', fill: COL.dim });
  }],

  ['q3', '小測驗', () => {}, { ask: done => quiz({ x: 330, y: 110, w: 940, cls: 'side' }, [{
    id: 'c-plan', prompt: ['下列做法合理嗎？'],
    build: grid([
      { parts: ['每一組只負責一個濃度'], ans: ['no'], why: '組和組之間的差異會和濃度綁在一起，分不開。' },
      { parts: ['每一組都量同一瓶共同對照樣品'], ans: ['ok'], why: '對照樣品讓我們估計組和組之間的差異。' },
      { parts: ['驗證用的市售醋，也拿來一起建校正線'], ans: ['no'], why: '參加過校正，就不再是獨立的驗證樣品。' },
      { parts: ['分析方法在看到數據之前就定好'], ans: ['ok'], why: '避免看了結果才挑方法（第 3 章）。' },
    ], [['ok', '合理'], ['no', '不合理']], { multi: false, text: true }),
  }], done) }],

  ['plan', '實驗計畫', (m) => {
    const p = panel(0);
    nTitle(p, '下一次實驗計畫');
    [['預試驗', '1 mm、同一瓶約 4 % 的醋重新填樣 10 次；同一次填樣掃 3 次', 'r1'],
     ['標準品', '原液滴定 × 3，秤重稀釋成 0–7 %、8 個濃度', 'r2'],
     ['主實驗', '8 個濃度 × 3 次填樣，分 3 個區塊，照順序表量', 'r3'],
     ['驗證', '3–5 種市售醋當盲樣，滴定 × 3、各填樣 3 次', 'r4'],
     ['紀錄', '日期、操作者、光徑、瓶號、第幾次填樣、順序、溫度、檔名', 'r5'],
     ['分析', '方法事先定好（2258 nm 或第 4 章的 PLS 設定），報告照第 5 章', 'r6']].forEach(([a, b, mark], i) => {
      nText(p, a, 190, 240 + i * 85, m(mark), { size: 30, fill: GOLD, weight: 700 });
      nText(p, b, 360, 240 + i * 85, m(mark) + .3, { size: 27 });
    });
  }],

  ['wrap', '總結', (m) => {
    const p = panel(0);
    nTitle(p, '總結');
    rows7(p, [['先做預試驗：知道填樣誤差，再決定量幾次。', 'w1'], ['重複做在誤差大的層次：重新稀釋、重新填樣。', 'w2'],
              ['多個等間隔濃度才能檢查直線；順序分區塊打亂。', 'w3'], ['用獨立盲樣驗證，並完整紀錄。', 'w4']], 230, 120, 36, m);
    nText(p, '練習會產生順序表和紀錄表，可以直接帶進實驗室', 800, 740, m('end'), { size: 30, fill: GOLD, anchor: 'middle' });
  }],

  ['final1', '本章練習', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lof', prompt: ['8 個濃度、每個填樣 3 次。檢查是不是直線（缺適性檢定）的自由度 = 濃度數 − 2 = ?'],
    build: blanks([{ parts: ['自由度 = ', { box: '6' }], why: '8 − 2 = 6；只量兩端時是 0，完全無法檢查。', hint: '濃度數是 8。' }]),
  }, {
    id: 'p-pilot', prompt: ['預試驗填樣 10 次，算出標準差 0.30 %。查表 k = 10 的上限倍數是 1.83，真正標準差的上限約為多少 %？（小數第二位）'],
    build: blanks([{ parts: ['上限 ≈ ', { box: '0.55' }, ' %'], why: '0.30 × 1.83 = 0.549，約 0.55 %。', hint: '上限 = 算出的標準差 × 上限倍數。' }]),
  }, {
    id: 'p-shared', prompt: ['同一個稀釋濃度填樣從 3 次加到 12 次，標準差卻幾乎沒有變小。最可能的原因是？'],
    build: choice([['配製（稀釋）誤差由所有填樣共用，填再多次也平均不掉'], ['填樣次數還是太少'], ['掃描雜訊太大']], 0,
      '填樣只平均掉填樣誤差；要縮小配製誤差，必須重新稀釋，或改善稀釋方法。',
      [null, '12 次已經很多，剩下的是共用的配製誤差。', '掃描雜訊只有約 0.03–0.17 %，不是主因。']),
  }], done, '本章練習') }],

  ['finish', '完成', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
